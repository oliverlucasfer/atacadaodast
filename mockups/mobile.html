<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile — Híbrido · Atacadão das Tintas</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F7F6F3;--navy:#333468;--muted:#5A5B72;--line:rgba(51,52,104,.16)}
  *{box-sizing:border-box}
  body{margin:0;background:#15161c;color:#fff;font-family:"IBM Plex Sans",sans-serif}
  .top{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
       padding:10px 16px;background:#15161c;border-bottom:1px solid rgba(255,255,255,.12);
       font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .top a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px}
  .top b{color:#ffd166}
  .frame{display:flex;justify-content:center;padding:28px 16px 60px}
  .phone{background:var(--paper);width:390px;border-radius:0;overflow:hidden;
         box-shadow:0 0 0 10px #000,0 0 0 11px #33343c,0 30px 60px rgba(0,0,0,.5)}
  iframe{width:390px;height:3300px;border:0;display:block;background:var(--paper)}
  .hint{max-width:390px;margin:0 auto 4px;font-family:"IBM Plex Mono",monospace;font-size:10px;
        letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);text-align:center}
</style>
</head>
<body>
  <div class="top">
    <span>Mobile 390px</span>
    <a href="hibrido.html">Voltar ao desktop</a>
    <span style="flex:1"></span>
    <span><b>mockup</b> · dados de exemplo</span>
  </div>
  <div class="frame">
    <div>
      <p class="hint">Role a página para ver o site inteiro</p>
      <div class="phone"><iframe src="hibrido.html?v=2" title="Prévia mobile"></iframe></div>
    </div>
  </div>
</body>
</html>
