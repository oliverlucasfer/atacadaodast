name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: testes
        run: node --test
      - name: portão de go-live (bloqueia publicar com pendência)
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-golive.mjs
